[package]
name = "lidx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
csv = "1.4.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ulid = { version = "3.0.0", features = ["std"] }
ureq = { version = "2", features = ["native-certs", "json"] }
